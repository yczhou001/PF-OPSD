# Stage 1 Protocol SFT configuration
# All values here override the defaults in stage1_sft.py

# Model
model_name_or_path: "Qwen/Qwen3.5-9B"
attn_implementation: "sdpa"   # flash_attention_2 requires flash-attn pkg; sdpa is safe default

# Data
trajectory_dir: "trajectory_gen/output/trajectories"
max_rollout_frames: 8
d_sim_balance: 2.0          # at most 2:1 ratio of yes:no trajectories
val_fraction: 0.02

# Training (paper: 1 epoch, lr=5e-6, batch=32, max_length=16384)
output_dir: "checkpoints/stage1_sft"
num_epochs: 1
per_device_batch_size: 2
gradient_accumulation_steps: 16   # effective batch = 2 * 16 * n_gpus
max_length: 16384
learning_rate: 5.0e-6
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
seed: 42
save_steps: 200
log_steps: 10

# LoRA (paper: r=64, alpha=128)
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
